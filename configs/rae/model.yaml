# Historical RAE architecture and online stage-1 encoder. Fill the five resource paths.
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: Dinov2withNorm
    encoder_config_path: YOUR_PATH/dinov2-with-registers-base
    encoder_input_size: 224
    encoder_params:
      dinov2_path: YOUR_PATH/dinov2-with-registers-base
      normalize: true
    decoder_config_path: YOUR_PATH/RAE/configs/decoder/ViTXL
    pretrained_decoder_path: YOUR_PATH/RAE/models/decoders/dinov2/wReg_base/ViTXL_n08/model.pt
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: YOUR_PATH/RAE/models/stats/dinov2/wReg_base/imagenet1k/stat.pt
stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size:
    - 1152
    - 2048
    depth:
    - 28
    - 2
    num_heads:
    - 16
    - 16
    mlp_ratio: 4.0
    class_dropout_prob: 0.0
    num_classes: 1001
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true
